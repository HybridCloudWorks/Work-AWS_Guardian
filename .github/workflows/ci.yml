name: ci

# -----------------------------------------------------------------------------
# NO-APPLY / NO-REMEDIATION GUARANTEE (CCG task 6.2)
#
# This workflow is VALIDATION-ONLY. It MUST NOT, under any trigger:
#   - run `terraform apply` / `terraform destroy` (only fmt/validate/test, all
#     plan- or local-only against a mock provider; `-backend=false` means no
#     remote state and no credentials);
#   - perform real remediation or call a real cloud control plane;
#   - set CCG_SANDBOX_E2E (the real-AWS end-to-end path stays opt-in and skipped
#     by default) or any CCG_SANDBOX / confirm flag that would enable mutation.
#
# No AWS credentials are configured for any job. Real-cloud integration and
# remediation are opt-in and run outside PR CI only.
#
# Tool versions are pinned (no floating `latest`). Workflow permissions are
# least privilege (read-only). Secret scanning runs on every push/PR.
# -----------------------------------------------------------------------------

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a real, released Terraform patch version within the
      # versions.tf constraint `>= 1.8.0, < 2.0.0`. 1.16.5 matches the runtime
      # the repo validated against (see the `.tftest.hcl` headers: "repo
      # runtime 1.16.5"). The previously configured 1.15.8 is NOT a real
      # Terraform release (the 1.x line goes ... 1.14 -> 1.16 -> 1.17-beta;
      # there is no 1.15.x) and would fail to resolve on the runner.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - run: terraform fmt -check -recursive

      # Credential-free init: no backend, no remote state, no AWS calls.
      - run: terraform init -backend=false -input=false

      # Provider lock/schema check (P2.1 / design §8): the AWS provider must be
      # pinned at 6.64.0 and the lock file must be internally consistent.
      # `-lockfile=readonly` fails the build if init would need to change the
      # lock. The grep is a defense-in-depth assertion on the pinned version.
      - name: Verify provider lock is pinned and consistent
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          grep -q 'registry.terraform.io/hashicorp/aws' .terraform.lock.hcl
          grep -q 'version[[:space:]]*=[[:space:]]*"6.64.0"' .terraform.lock.hcl

      - run: terraform validate

      # Native Terraform tests (tasks 2.2/2.3/2.4/2.5). Credential-free: each
      # suite uses a mock AWS provider and module-scoped runs, so no AWS calls
      # and no `apply` against real infrastructure. `terraform test` only runs
      # plan/apply against the mock provider in an ephemeral local workspace.
      - name: terraform test (mock-provider, credential-free)
        run: terraform test

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - run: tflint --init
      - run: tflint

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "ruff==0.16.6" "pytest==8.3.5"
      - run: ruff check src tests
      # Offline test matrix only. The real-AWS sandbox e2e is gated behind
      # CCG_SANDBOX_E2E, which is intentionally NOT set here (skipped by default).
      - run: pytest -q
      - run: python scripts/validate_policy_baseline.py

      # Cedar schema validation (task 1.3). The `cedar` CLI is not preinstalled
      # on ubuntu-latest; CEDAR_SOFT_SKIP=1 downgrades a missing binary to a
      # soft skip (logged) so CI does not hard-fail on an absent CLI, while
      # still running full validation whenever the CLI is present. Real
      # validation errors still fail the job. See scripts/validate_cedar.sh.
      - name: Cedar policy validation (soft-skip if CLI absent)
        env:
          CEDAR_SOFT_SKIP: "1"
        run: bash scripts/validate_cedar.sh

      - run: python scripts/seed_drift.py --help
      - run: PYTHONPATH=src python -m ccg.demo
      - run: python scripts/gate02_preflight.py

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      # Console unit tests added in task 5.2 (Vitest, `vitest run` via the
      # `test` script). Runs after typecheck, before build.
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.90.5
        with:
          extra_args: --results=verified,unknown
