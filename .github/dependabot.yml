# Dependabot configuration for Work-AWS_Guardian
# Covers every dependency ecosystem present in the repo so updates (incl.
# security patches) arrive as reviewable PRs rather than surfacing only as a
# failing CI audit. Grouped minor/patch updates keep PR volume manageable.
version: 2
updates:
  # Next.js console (npm)
  - package-ecosystem: "npm"
    directory: "/console"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      console-minor-patch:
        update-types: ["minor", "patch"]

  # Python domain model / tooling (pip via pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Terraform root module
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # ADR 0005 pins hashicorp/aws to exactly 6.64.0 in the root and all eleven
      # modules. Upgrades follow the review in docs/AGENTCORE_CAPABILITY_RECORD.md
      # ("Provider-upgrade risk documentation"): release-note review, a sandbox
      # plan, then pins, lock file, CI check and gate02_preflight.py together.
      # A one-file Dependabot bump can't satisfy that, so it is done by hand.
      - dependency-name: "hashicorp/aws"